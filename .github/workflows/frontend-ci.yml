name: frontend-ci

on:
  push:
    branches: [main]
    paths: ["frontend/**", "justfile", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", "justfile", ".github/workflows/frontend-ci.yml"]
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: Frontend format + lint + type-check + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node (Vite+ and native TypeScript bridge)
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, lint, and Vue type-check
        run: bun run check

      - name: Test and coverage
        run: bun run test:coverage

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: bun run build
