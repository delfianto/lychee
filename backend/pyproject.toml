[project]
name = "lychee-backend"
version = "0.1.0b8"
description = "lychee — self-hosted manga/comic/ebook media server (backend)"
requires-python = ">=3.14"

dependencies = [
    # Web framework
    "fastapi==0.161.1",
    "uvicorn[standard]==0.54.0",
    # Persistence
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    # Validation / settings
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    # Logging
    "structlog==26.1.0",
    # ID generation
    "nanoid==2.0.0",
    # Media / images — AVIF encode + decode/resize. Native AVIF ships in the
    # Pillow ≥11.3 wheels (bundled libavif), so no system libs.
    "pillow==13.0.0",
    # Providers / trackers — HTTP client for MangaDex / AniList / ….
    "httpx==0.28.1",
    # Secrets encryption at rest (provider/tracker tokens).
    "cryptography>=49.0.0",
    # File uploads (local import).
    "python-multipart>=0.0.32",
    # Fast content-hash fingerprints for scan reconcile / restore.
    "xxhash>=3.8.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
    "basedpyright==1.40.2",
]

# This is an application, not a distributable package — uv manages the env + deps,
# and `src` is imported by running from backend/ (uvicorn / pytest / uv run).
[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"
# Auto-generated Alembic migrations are never linted/formatted.
extend-exclude = ["alembic/versions"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (formatter handles wrapping)
    "B008", # do not perform function call in argument defaults (FastAPI Depends)
]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/.venv/**", "**/__pycache__/**", "alembic/versions/**"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportImportCycles = true
pythonVersion = "3.14"
pythonPlatform = "Linux"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260724",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = true
