[project]
name = "lychee-mcp"
version = "0.0.1"
description = "lychee — MCP server for agent-assisted library operations (notes/plan.md PART J)"
requires-python = ">=3.14"

dependencies = [
    # MCP server framework.
    "fastmcp==3.2.4",
    # HTTP client — this server is a client of the backend's REST API, not a
    # direct consumer of its ORM/service layer (see notes/plan.md PART J).
    "httpx==0.28.1",
    # Config (LYCHEE_API_URL, .env support).
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.22",
    "basedpyright==1.39.9",
]

# This is an application, not a distributable package — uv manages the env + deps,
# and `src` is imported by running from mcp/ (matches backend/pyproject.toml).
[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (formatter handles wrapping)
]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/.venv/**", "**/__pycache__/**"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
pythonVersion = "3.14"
pythonPlatform = "Linux"

[tool.pytest.ini_options]
asyncio_mode = "auto"
